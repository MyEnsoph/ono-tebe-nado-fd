<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оно тебе надо — аукцион вещей, в которые никто не верил</title>
    <!-- подключение шрифтов -->
    <link rel="stylesheet" href="fonts/fonts.css">
    <!-- подключение глобальных стилей -->
    <link rel="stylesheet" href="styles/global.css">
    <!-- подключение локальных стилей -->
    <link rel="stylesheet" href="styles/style.css">
  </head>
  <body>
    <header class = "header">
      <nav class = "nav"></nav>
      <a href = "#" class = "logo">
        <img src="images/logo-black.svg" alt="Оно тебе надо" class = "logo_img">
      </a>
      <address class="contacts"></address>
    </header>
    <main>
      <section class="cover">
        <img src="images/cover.jpg" class = "cover_img">
        <h1 class="cover_title"></h1>
        <div class="description">
          <p class="cover_description_text"></p>
          <button class="cover_button"></button>
        </div>
      </section>
      <section class="lots">
        <h2 class="lots_title"></h2>
        <ul class="lots_list">
          <li class="lots_list_item">
            <img src="images/card-lot-01.jpg" class="lot_1">
            <a href="#" class="lots_link">
              <article class="lot_film"></article>
            </a>
          </li>
          <li class="lots_list_item">
            <img src="images/card-lot-02.jpg" class="lot_2">
            <a href="#" class="lots_link">
              <article class="lot_book"></article>
            </a>
          </li>
          <li class="lots_list_item">
            <img src="images/card-lot-03.jpg" class="lot_3">
            <a href="#" class="lots_link">
              <article class="lot_picture"></article>
            </a>
          </li>
        </ul>
      </section>
      <section class = "about">
        <img src="images/logo-white.svg" class="about_logo">
        <div class="about_column"></div>
        <div>
          <h2 class="about_title"></h2>
          <div class="about_text"></div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <address class="footer_contacts"></address>
      <nav class="footer_nav"></nav>
      <div class="footer_social">
        <img src="images/pinterest.svg" class="social_pint">
        <img src="images/vk.svg" class="social_vk">
        <img src="images/yt.svg" class="social_yt">
      </div>
    </footer>
  </body>
</html>
